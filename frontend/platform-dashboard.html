<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="robots" content="noindex,nofollow" />
  <title>contan2 · Plataforma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="platform.css" />
</head>
<body>
  <div id="pf-must-change-banner" class="pf-banner pf-banner--warn" hidden>
    <i class="fa-solid fa-triangle-exclamation"></i>
    Tu contraseña actual es temporal. Cámbiala antes de seguir trabajando.
    <button type="button" class="pf-banner__cta" id="pf-banner-go">Cambiar ahora</button>
  </div>

  <div class="pf-shell">
    <aside class="pf-sidebar" id="pf-sidebar">
      <div class="pf-sidebar__brand">
        <div class="pf-logo">c2</div>
        <div>
          <div class="pf-brand__name">contan2</div>
          <div class="pf-brand__sub">plataforma</div>
        </div>
      </div>

      <nav class="pf-nav" aria-label="Principal">
        <a href="#/operacion" class="pf-nav-link" data-route="operacion">
          <i class="fa-solid fa-gauge-high"></i>
          <span>Operación</span>
        </a>
        <a href="#/tenants" class="pf-nav-link" data-route="tenants">
          <i class="fa-solid fa-building"></i>
          <span>Tenants</span>
        </a>
        <a href="#/audit" class="pf-nav-link" data-route="audit">
          <i class="fa-solid fa-clipboard-list"></i>
          <span>Bitácora</span>
        </a>
        <a href="#/account" class="pf-nav-link" data-route="account">
          <i class="fa-solid fa-user-gear"></i>
          <span>Mi cuenta</span>
        </a>
      </nav>

      <div class="pf-sidebar__foot">
        <div class="pf-user-card">
          <div class="pf-avatar" id="pf-avatar">··</div>
          <div class="pf-user-meta">
            <div class="pf-user-name" id="pf-user-name">…</div>
            <div class="pf-user-role">Super admin</div>
          </div>
        </div>
        <button class="pf-btn pf-btn--ghost pf-btn--full" id="pf-logout-btn">
          <i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión
        </button>
      </div>
    </aside>

    <main class="pf-main">
      <header class="pf-topbar">
        <button class="pf-burger" id="pf-burger" aria-label="Abrir menú">
          <i class="fa-solid fa-bars"></i>
        </button>
        <div class="pf-page-titles">
          <h1 id="pf-page-title">Operación</h1>
          <p id="pf-page-subtitle">Vista de plataforma. Datos cross-tenant en tiempo real.</p>
        </div>
        <div class="pf-topbar__actions" id="pf-topbar-actions"></div>
      </header>

      <section class="pf-content" id="pf-content">
        <div class="pf-loader"><div class="pf-spinner"></div></div>
      </section>
    </main>

    <div class="pf-sidebar-backdrop" id="pf-sidebar-backdrop"></div>
  </div>

  <!-- Modal genérico -->
  <div class="pf-modal" id="pf-modal" hidden aria-hidden="true">
    <div class="pf-modal__backdrop" data-close></div>
    <div class="pf-modal__card" role="dialog" aria-modal="true">
      <header class="pf-modal__head">
        <h3 id="pf-modal-title"></h3>
        <button type="button" class="pf-modal__x" data-close aria-label="Cerrar">×</button>
      </header>
      <div class="pf-modal__body" id="pf-modal-body"></div>
    </div>
  </div>

  <!-- Toasts -->
  <div class="pf-toasts" id="pf-toasts"></div>

  <script src="platform-router.js"></script>
  <script src="platform-app.js"></script>
  <script src="platform-views.js"></script>
</body>
</html>
