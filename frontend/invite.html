<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Aceptar invitación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/login.css" />
  <script src="/branding.js"></script>
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <div class="auth-brand" id="auth-brand">
        <div class="auth-brand-logo" id="auth-logo"></div>
        <div class="auth-brand-org" id="auth-org-name"></div>
      </div>

      <div class="auth-view is-active" id="invite-host">
        <div class="auth-loader">
          <div class="auth-spinner"></div>
          <p>Validando tu invitación…</p>
        </div>
      </div>
    </section>
  </main>
  <script src="/invite.js"></script>
</body>
</html>
