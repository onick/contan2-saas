# =============================================================================
# .github/workflows/security-tests.yml
# =============================================================================
# Suite de seguridad de la rama security/p0-hardening:
#   1. Unit tests (DB_DRIVER=memory) — corre primero, fail-fast.
#   2. Postgres integration tests — sólo si el job unit pasa. Levanta
#      postgres:16 como service container, aplica migraciones + seed,
#      corre vitest contra DB real (npm test sin skips de Postgres).
#   3. Auditoría de SVG históricos — verifica el repo (no producción).
#
# El workflow NO toca producción, NO deploya, NO publica artefactos sensibles.
# Solo valida que las dos suites pasan limpio.
# =============================================================================

name: security/p0-hardening

on:
  push:
    branches:
      - security/p0-hardening
      - main
      - multitenant
  pull_request:
    branches:
      - main
      - multitenant

jobs:
  # -------------------------------------------------------------------------
  # Job 1: unit tests con DB_DRIVER=memory (rápido, sin servicios externos).
  # -------------------------------------------------------------------------
  unit:
    name: unit tests (memory driver)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 20 EOL fue 2026-04-30 — usamos 24 (current LTS al cierre
          # de FASE 1.A, 2026-05-27).
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: vitest (memory driver)
        run: npm test

  # -------------------------------------------------------------------------
  # Job 2: Postgres integration. Depende de unit (fail-fast).
  # -------------------------------------------------------------------------
  postgres:
    name: integration (postgres-real)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: contan2_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d contan2_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DB_DRIVER: postgres
      DATABASE_URL: postgres://test:test@localhost:5433/contan2_test
      SECRET_BASE: test-secret-base-32-bytes-min-aaaaaaaaaaaaaaaa
      ROOT_DOMAIN: localhost
      PUBLIC_URL: http://localhost:3457
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 20 EOL fue 2026-04-30 — usamos 24 (current LTS al cierre
          # de FASE 1.A, 2026-05-27).
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: seed test fixtures (idempotente; corre migraciones también)
        run: node scripts/seed-test-fixtures.mjs
      - name: vitest contra Postgres real (sin skips)
        run: npm test

  # -------------------------------------------------------------------------
  # Job 3: Auditoría de SVG accidentalmente commiteados al repo.
  # NO valida el volumen de producción (eso vive sólo en el VPS y requiere
  # SSH, ver docs/migration-v2/06-svg-quarantine-runbook.md). Este job sólo
  # mira `backend/data/uploads/` del checkout — que en CI siempre debería
  # estar vacío salvo `.gitkeep` por el .gitignore. Si algún PR mete un SVG
  # ahí accidentalmente, este job lo atrapa con exit 10 ó 20.
  # -------------------------------------------------------------------------
  # Job id preservado como `audit-svg` para no romper branch protection
  # rules que requieran ese check name; solo cambia el `name:` visible.
  audit-svg:
    name: SVG accidentalmente commiteados (NO valida prod)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 20 EOL fue 2026-04-30 — usamos 24 (current LTS al cierre
          # de FASE 1.A, 2026-05-27).
          node-version: '24'
      - name: inventario SVG en checkout (NO en volumen prod)
        run: |
          node backend/scripts/audit-historical-svg.mjs
          # IMPORTANTE: el dir default del script es backend/data/uploads/
          # relativo al checkout, NO el volumen productivo /data/contan2/uploads.
          # Para auditar prod hay que SSH al VPS y correrlo contra el bind mount
          # — ver docs/migration-v2/06-svg-quarantine-runbook.md. Este job sólo
          # bloquea si alguien commiteó un SVG al repo por accidente.
          # Exit codes: 0 sin SVG, 10 SVG sin flags de riesgo, 20 SVG con flags.
